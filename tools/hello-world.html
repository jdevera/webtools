<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <meta name="description" content="A friendly greeting and a demo of the webtools format.">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 30rem; margin: 4rem auto; padding: 0 1rem; text-align: center; }
    h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    p { color: #555; }
  </style>
</head>
<body>
  <h1>Hello, world!</h1>
  <p>The current time is <span id="time"></span>.</p>
  <p><a href="/">← back to tools</a></p>
  <script>
    document.getElementById('time').textContent = new Date().toLocaleTimeString();
  </script>
</body>
</html>
